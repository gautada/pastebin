<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" />
    <title>{{ title or "myapp" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Optional -->
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body>
    {% block header %}
    <header class="site-header">
      <div class="brand">
        <a class="brand-title" href="/">Pastebin</a>
        <p class="brand-tagline">Drop · Bin · Retrieve</p>
      </div>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-nav"
        data-nav-toggle
      >
        <span class="sr-only">Toggle navigation</span>
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-links" id="primary-nav" aria-label="Primary" data-nav>
        <a href="#upload">Upload</a>
        <a href="#latest">Latest</a>
        <a href="#results">Results</a>
        <a href="/search">Search</a>
      </nav>

      <div class="header-actions">
        <form class="search-form" action="/search" method="get" role="search">
          <label class="sr-only" for="header-search">Search bins</label>
          <input
            id="header-search"
            name="q"
            type="search"
            placeholder="Search by name or ID"
            aria-label="Search bins"
            value="{{ request.query_params.get('q', '') }}"
          />
          <button type="submit">Search</button>
        </form>
        <a class="bin-link" href="#upload">New Bin</a>
      </div>
    </header>
    <script>
      const navToggle = document.querySelector('[data-nav-toggle]');
      const nav = document.querySelector('[data-nav]');

      if (navToggle && nav) {
        navToggle.addEventListener('click', () => {
          const expanded = navToggle.getAttribute('aria-expanded') === 'true';
          navToggle.setAttribute('aria-expanded', String(!expanded));
          nav.dataset.open = expanded ? 'false' : 'true';
        });
      }
    </script>
    {% endblock %} {% block content %}{% endblock %} {% block footer %}
    <footer id="results">
      <h3>Results</h3>
      <pre id="result" class="result">No uploads yet.</pre>
      <p>Status: Ready</p>
    </footer>
    {% endblock %}
  </body>
</html>

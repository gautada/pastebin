<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" />
    <title>{{ title or "myapp" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Optional -->
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body>
    {% block header %}
    <header class="header">
      <h1>Pastebin</h1>
      <div class="search">
        <input type="text" placeholder="Search..." aria-label="Search" />
        <button type="button">Search</button>
      </div>
      <div class="hamburger-menu">
        <input type="checkbox" id="menu-toggle" style="display: none" />
        <label for="menu-toggle" class="menu-icon">
          <span></span>
          <span></span>
          <span></span>
        </label>
        <nav class="nav">
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <script>
      document.querySelectorAll(".menu-icon").forEach((item) => {
        item.addEventListener("click", (event) => {
          const nav = item.nextElementSibling;
          nav.style.display = nav.style.display === "block" ? "none" : "block";
        });
      });
    </script>
    {% endblock %} {% block content %}{% endblock %} {% block footer %}
    <footer id="results" class="results-panel">
      <div class="results-header">
        <div>
          <h3>Results</h3>
          <p class="muted">Latest uploads this session</p>
        </div>
        <p id="results-status" class="sr-only" aria-live="polite">Ready</p>
      </div>
      <div class="results-body">
        <div id="results-empty" class="results-empty">No uploads yet.</div>
        <div class="results-table" role="region" aria-label="Upload results" hidden>
          <div class="results-columns" aria-hidden="true">
            <span>File</span>
            <span>Details</span>
            <span class="col-actions">Actions</span>
          </div>
          <ul id="results-list" class="results-list" hidden></ul>
        </div>
      </div>
    </footer>
    {% endblock %}
  </body>
</html>
